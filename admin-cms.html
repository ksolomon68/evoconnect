<!DOCTYPE html>
<html lang="en" data-theme="dashboard">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="EVOConnected CMS Admin — Enterprise content management, live preview hydration, and page builder console.">
  <meta name="robots" content="noindex, nofollow">
  <title>CMS Admin — EVOConnected</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EVOConnected CMS">
  <link rel="apple-touch-icon" href="/images/favicon.png">

  <!-- Executive Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design Tokens & CMS Styles -->
  <link rel="stylesheet" href="css/design-system.css?v=3.8.0">
  <link rel="stylesheet" href="css/admin-cms.css?v=3.8.0">
</head>

<body>
  <!-- Application mount point — content injected by admin-cms.js -->
  <div id="cms-app" role="application" aria-label="EVOConnected CMS Admin">
    <!-- Executive loading screen -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;
                background:#0B0F19;color:#fff;font-family:'Inter',sans-serif;">
      <div style="text-align:center">
        <img src="/images/favicon.png" alt="EVOConnected" style="height:44px;width:auto;margin-bottom:1.25rem;">
        <div style="width:36px;height:36px;border:3px solid rgba(6,182,212,.2);
                    border-top-color:#06B6D4;border-radius:50%;animation:spin .7s linear infinite;
                    margin:0 auto 1rem"></div>
        <p style="color:#94A3B8;font-size:0.92rem;font-weight:600;letter-spacing:0.02em;">Initializing EVOConnected CMS…</p>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Agency & App config must load first so API_URL is available -->
  <script src="agency.config.js?v=3.8.0"></script>
  <script src="js/config.js?v=3.8.0"></script>
  <!-- Sortable.js for drag-and-drop FAQ reordering -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js?v=3.8.0"></script>
  <!-- Focus trap/restore for hand-built modals -->
  <script src="js/utils/modal-trap.js?v=3.8.0"></script>
  <!-- CMS admin application -->
  <script src="js/admin-cms.js?v=3.8.0"></script>
  <script src="js/pwa.js?v=3.8.0"></script>
</body>

</html>
