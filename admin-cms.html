<!DOCTYPE html>
<html lang="en" data-theme="dashboard">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="WorkForce Connect CMS Admin — manage site content, pages, media, and global settings.">
  <meta name="robots" content="noindex, nofollow">
  <title>CMS Admin — EvoConnect</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WFC">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Shared design tokens (brand colors, focus states, reduced-motion),
       then CMS-specific layout/component styles on top. No site main.css —
       the CMS stays a focused admin shell, not the public marketing page. -->
  <link rel="stylesheet" href="css/design-system.css?v=3.4.1">
  <link rel="stylesheet" href="css/admin-cms.css?v=3.4.1">
</head>

<body>
  <!-- data-theme="dashboard" lives on <html> above, not here: :root (where
       design-system.css's --text-muted/--card-bg/etc. aliases resolve)
       matches <html>, not <body>, so the attribute has to be on <html> for
       those aliases to pick up the light theme instead of silently
       resolving to the dark-theme values at :root and inheriting that in. -->
  <!-- Application mount point — content injected by admin-cms.js -->
  <div id="cms-app" role="application" aria-label="WorkForce Connect CMS">
    <!-- Login screen or shell will be rendered here -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;
                background:#003F63;color:#fff;font-family:Arial,sans-serif;">
      <div style="text-align:center">
        <div style="width:32px;height:32px;border:4px solid rgba(255,255,255,.3);
                    border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
                    margin:0 auto 1rem"></div>
        <p>Loading CMS…</p>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Agency & App config must load first so API_URL is available -->
  <script src="agency.config.js?v=3.5.0"></script>
  <script src="js/config.js?v=3.5.0"></script>
  <!-- Sortable.js for drag-and-drop FAQ reordering -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js?v=3.5.0"></script>
  <!-- Focus trap/restore for hand-built modals (must load before admin-cms.js) -->
  <script src="js/utils/modal-trap.js?v=3.5.2"></script>
  <!-- CMS admin application -->
  <script src="js/admin-cms.js?v=3.5.2"></script>
  <script src="js/pwa.js?v=3.5.0"></script>
  <script src="https://primereachgov.com/license-gate.js"></script>
</body>

</html>
