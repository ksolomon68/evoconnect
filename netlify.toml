[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit", "mysql2"]
  included_files = ["node_modules/**", "server/**", "views/**", "content/**", "data/**", "admin-cms.html", "agency.config.js", "images/**", "assets/**", "css/**", "js/**", "public/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
  force = false
